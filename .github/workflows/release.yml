# Publishes a release when a version tag is pushed, built from the upstream
# version pinned in native/versions.env. The tag has to match that pin: v1.8.1,
# v1.8.1.1 for a Java-only fix, or v1.8.1-rc1 for a pre-release.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          source native/versions.env
          case "$GITHUB_REF_NAME" in
            "v$AIRSPYHF_VERSION" | "v$AIRSPYHF_VERSION".[0-9]* | "v$AIRSPYHF_VERSION"-*) ;;
            *)
              echo "::error::Tag $GITHUB_REF_NAME does not match pinned upstream version $AIRSPYHF_VERSION"
              exit 1
              ;;
          esac
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd jars && sha256sum *.jar > SHA256SUMS)
          main_jar="$(ls jars/jairspyhf-*.jar | grep -Ev -- '-(sources|javadoc)\.jar$')"
          info="$(unzip -p "$main_jar" jairspyhf/native/linux-x86_64/build-info.properties)"
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" jars/* "${prerelease[@]}" \
            --verify-tag --generate-notes --title "jAirspyHF ${GITHUB_REF_NAME#v}" \
            --notes "Native library versions:

          \`\`\`
          $info
          \`\`\`"
